# ==========================================================================
# CRE SECRETS
# ==========================================================================
# Maps the secret id the workflow asks for with `runtime.getSecret({ id })` to
# the environment variable holding its value.
#
# In a confidential workflow the Vault DON releases these directly into the
# attested enclave. They are never in plaintext to node operators and never in
# Workflow DON node memory.
#
# Both entries are secret for different reasons, and the second is the
# interesting one.
#
#   GRAPH_API_KEY         credential. Also makes the request URL confidential,
#                         since the key is a path segment of it.
#   SENTINEL_RISK_POLICY  the risk policy: shock ladder, per-asset betas,
#                         composite weights, k-anonymity floor. Secret not
#                         because it is embarrassing but because a published
#                         recipe is a gameable one — a borrower who knows the
#                         exact shock ladder knows how far to unwind to fall out
#                         of the distressed set. The output stays public; the
#                         recipe does not. See lib/signal/policy.ts.
#
# What is NOT confidential: the workflow binary. The logic in workflow.ts is
# revealed to node operators, and only the data it computes over is protected.
# docs/ENCLAVE.md states the boundary field by field.
secretsNames:
    GRAPH_API_KEY:
        - CRE_GRAPH_API_KEY
    SENTINEL_RISK_POLICY:
        - CRE_SENTINEL_RISK_POLICY
